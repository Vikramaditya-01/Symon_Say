<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says - Monochroma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <header>
            <h1>Simon Says</h1>
            <h2 id="status-text">Press any key to start</h2>
            <div class="scores">
                <p>Score: <span id="current-score">0</span></p>
                <p>Best: <span id="high-score">0</span></p>
            </div>
        </header>

        <div class="btn-container">
            <div class="line-one">
                <div class="btn shade-1" type="button" id="shade-1"></div>
                <div class="btn shade-2" type="button" id="shade-2"></div>
            </div> 
            <div class="line-two">
                <div class="btn shade-3" type="button" id="shade-3"></div>
                <div class="btn shade-4" type="button" id="shade-4"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
